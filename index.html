<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADHD POV Experience - Deep Interactive Story</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
            user-select: none;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.94);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        canvas {
            touch-action: none;
            background: #0f172a;
            border-radius: 1.25rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 md:p-6 relative">

    <main class="w-full max-w-4xl glass-panel rounded-3xl p-4 md:p-6 relative z-10 flex flex-col justify-between min-h-[760px]">
        
        <header class="border-b border-slate-800 pb-4 mb-3">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                    <span id="scene-clock" class="text-xs md:text-sm font-bold uppercase tracking-wider text-slate-300">7:45 AM • Morning Initiation</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="resetScene()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                        <i class="fa-solid fa-rotate-right"></i> Restart Simulation
                    </button>
                </div>
            </div>

            <!-- ADHD Metrics Grid (Neutral Styling) -->
            <div class="grid grid-cols-3 gap-2 md:gap-3">
                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800">
                    <div class="flex justify-between items-center mb-1 text-[11px] font-semibold text-slate-400">
                        <span>Task Completion</span>
                        <span id="val-progress" class="text-slate-200 font-bold">10%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="bar-progress" class="bg-slate-400 h-full rounded-full transition-all duration-300" style="width: 10%;"></div>
                    </div>
                </div>

                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800">
                    <div class="flex justify-between items-center mb-1 text-[11px] font-semibold text-slate-400">
                        <span>Impulse Pressure</span>
                        <span id="val-impulse" class="text-slate-200 font-bold">75%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="bar-impulse" class="bg-slate-400 h-full rounded-full transition-all duration-300" style="width: 75%;"></div>
                    </div>
                </div>

                <div class="bg-slate-950/80 p-2.5 rounded-xl border border-slate-800">
                    <div class="flex justify-between items-center mb-1 text-[11px] font-semibold text-slate-400">
                        <span>Mental Reserve</span>
                        <span id="val-energy" class="text-slate-200 font-bold">80%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="bar-energy" class="bg-slate-400 h-full rounded-full transition-all duration-300" style="width: 80%;"></div>
                    </div>
                </div>
            </div>
        </header>

        <section class="flex-grow flex flex-col items-center justify-center relative my-2">
            <div class="relative w-full max-w-[680px]">
                <canvas id="povCanvas" width="680" height="340" class="w-full h-[340px] shadow-2xl border border-slate-800 cursor-pointer"></canvas>
                
                <div id="thought-overlay" class="absolute top-3 left-1/2 -translate-x-1/2 bg-slate-900/95 border border-slate-700 text-slate-200 text-xs md:text-sm px-4 py-2 rounded-xl shadow-xl flex items-center justify-center transition-all duration-300 max-w-[90%] text-center">
                    <span id="thought-text" class="font-medium">"The phone screen illuminated. A notification is waiting."</span>
                </div>

                <div class="absolute bottom-2 left-3 bg-slate-950/80 text-[10px] text-slate-400 px-2.5 py-1 rounded-md border border-slate-800 flex items-center gap-1.5">
                    Click objects in the environment to observe current thoughts.
                </div>
            </div>
        </section>

        <footer id="action-controls" class="mt-2 flex flex-col gap-2">
            <div id="action-banner" class="text-xs text-center text-slate-300 font-medium bg-slate-900/80 p-2 rounded-xl border border-slate-800">
                <span id="banner-text" class="text-slate-300">Select how to proceed:</span>
            </div>
            
            <div id="button-grid" class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
            </div>
        </footer>

    </main>

    <script>
        const canvas = document.getElementById('povCanvas');
        const ctx = canvas.getContext('2d');

        let state = {
            progress: 10,
            impulse: 75,
            energy: 80,
            stage: "PHONE_RUSH",
            history: [],
            character: {
                x: 140,
                y: 220,
                targetX: 520,
                isWalking: false,
                state: "NEUTRAL"
            },
            timeTick: 0
        };

        const ROOM = {
            bed: { x: 40, y: 170, width: 100, height: 110, hotspot: "BED" },
            desk: { x: 250, y: 160, width: 140, height: 100, hotspot: "DESK" },
            nightstand: { x: 520, y: 180, width: 80, height: 80, hotspot: "PHONE" },
            bookshelf: { x: 160, y: 50, width: 70, height: 90, hotspot: "BOOKSHELF" },
            window: { x: 440, y: 40, width: 80, height: 80, hotspot: "WINDOW" }
        };

        function drawRoom() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let wallGrad = ctx.createLinearGradient(0, 0, 0, 240);
            wallGrad.addColorStop(0, '#0f172a');
            wallGrad.addColorStop(1, '#1e293b');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(0, 0, canvas.width, 240);

            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(0, 240, canvas.width, 100);

            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 236, canvas.width, 4);

            // Window
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(ROOM.window.x, ROOM.window.y, ROOM.window.width, ROOM.window.height);
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 3;
            ctx.strokeRect(ROOM.window.x, ROOM.window.y, ROOM.window.width, ROOM.window.height);
            ctx.fillStyle = 'rgba(56, 189, 248, 0.1)';
            ctx.fillRect(ROOM.window.x + 4, ROOM.window.y + 4, ROOM.window.width - 8, ROOM.window.height - 8);

            // Bookshelf
            ctx.fillStyle = '#334155';
            ctx.fillRect(ROOM.bookshelf.x, ROOM.bookshelf.y, ROOM.bookshelf.width, ROOM.bookshelf.height);
            ctx.fillStyle = '#475569';
            ctx.fillRect(ROOM.bookshelf.x + 10, ROOM.bookshelf.y + 15, 12, 25);
            ctx.fillRect(ROOM.bookshelf.x + 25, ROOM.bookshelf.y + 10, 12, 30);
            ctx.fillRect(ROOM.bookshelf.x + 40, ROOM.bookshelf.y + 20, 12, 20);

            // Bed
            ctx.fillStyle = '#312e81';
            ctx.fillRect(ROOM.bed.x, ROOM.bed.y, ROOM.bed.width, ROOM.bed.height);
            ctx.fillStyle = '#4338ca';
            ctx.fillRect(ROOM.bed.x + 10, ROOM.bed.y + 10, ROOM.bed.width - 20, 30);

            // Desk & Laptop
            ctx.fillStyle = '#475569';
            ctx.fillRect(ROOM.desk.x, ROOM.desk.y, ROOM.desk.width, ROOM.desk.height);
            
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(ROOM.desk.x + 45, ROOM.desk.y - 30, 50, 35);
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(ROOM.desk.x + 48, ROOM.desk.y - 27, 44, 28);

            ctx.fillStyle = '#ffffff';
            ctx.font = '9px Plus Jakarta Sans';
            ctx.textAlign = 'center';
            ctx.fillText("Work Canvas", ROOM.desk.x + 70, ROOM.desk.y - 10);

            // Nightstand + Phone
            ctx.fillStyle = '#334155';
            ctx.fillRect(ROOM.nightstand.x, ROOM.nightstand.y, ROOM.nightstand.width, ROOM.nightstand.height);

            ctx.fillStyle = '#64748b';
            ctx.fillRect(ROOM.nightstand.x + 30, ROOM.nightstand.y - 18, 22, 32);

            drawCharacter();
        }

        function drawCharacter() {
            let c = state.character;
            
            let bobY = c.isWalking ? Math.sin(state.timeTick * 0.25) * 5 : 0;
            let currentY = c.y + bobY;

            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(c.x, c.y + 22, 22, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#6366f1';
            ctx.beginPath();
            ctx.arc(c.x, currentY, 22, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1e1b4b';
            ctx.beginPath();
            ctx.arc(c.x, currentY - 8, 20, Math.PI, Math.PI * 2);
            ctx.fill();
        }

        function updateAnimation() {
            state.timeTick++;
            let c = state.character;

            if (Math.abs(c.x - c.targetX) > 4) {
                c.isWalking = true;
                c.x += (c.targetX - c.x) * 0.05;
            } else {
                c.isWalking = false;
                if (state.stage === "PHONE_RUSH" && c.x >= 480) {
                    triggerStage("PHONE_TRAPPED");
                }
            }

            drawRoom();
            requestAnimationFrame(updateAnimation);
        }

        // Helper to shuffle array elements so options aren't consistently on one side
        function shuffleOptions(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderButtons(options) {
            const btnGrid = document.getElementById('button-grid');
            btnGrid.innerHTML = '';
            
            // Randomize position so positive/negative strategies aren't aligned to specific columns
            const randomized = shuffleOptions([...options]);

            randomized.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "p-3.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs md:text-sm font-medium text-slate-200 transition text-left border border-slate-700 hover:border-slate-500 shadow-sm flex flex-col justify-between";
                btn.onclick = () => intervene(opt.action);
                
                btn.innerHTML = `
                    <span class="font-semibold text-slate-100 mb-1">${opt.label}</span>
                    <span class="text-[11px] text-slate-400 font-normal leading-relaxed">${opt.subtext}</span>
                `;
                btnGrid.appendChild(btn);
            });
        }

        function triggerStage(stageName) {
            state.stage = stageName;
            const thoughtText = document.getElementById('thought-text');
            const bannerText = document.getElementById('banner-text');

            // STAGE 1: MORNING INITIATION
            if (stageName === "PHONE_RUSH") {
                state.character.targetX = 520;
                state.impulse = 75;
                state.energy = 85;
                state.progress = 10;
                document.getElementById('scene-clock').innerText = '7:45 AM • Morning Initiation';
                thoughtText.innerText = '"A notification flashed on the phone across the room."';
                bannerText.innerText = 'Movement initiated toward phone. Determine next approach:';

                renderButtons([
                    { label: "Check notification first", subtext: "Inspect incoming updates before starting work.", action: "LET_RUN" },
                    { label: "Move phone out of reach and sit at desk", subtext: "Place device in drawer and sit down in front of workspace.", action: "DESK_INITIATED" },
                    { label: "Leave room to grab water first", subtext: "Step away briefly before beginning morning tasks.", action: "KITCHEN_SIDEQUEST" }
                ]);
            }
            // STAGE 1 B: KITCHEN DISTRACTION
            else if (stageName === "KITCHEN_SIDEQUEST") {
                state.character.targetX = 80;
                state.impulse = 65;
                state.energy = 80;
                document.getElementById('scene-clock').innerText = '7:55 AM • Kitchen Transition';
                thoughtText.innerText = '"In the kitchen, several dirty dishes are piled near the sink."';
                bannerText.innerText = 'Unexpected secondary task present. Select action:';

                renderButtons([
                    { label: "Wash dishes now", subtext: "Clear the sink completely before returning to desk.", action: "CLEAN_SINK" },
                    { label: "Pour water and return immediately to desk", subtext: "Ignore dirty dishes and return straight to workspace.", action: "DESK_INITIATED" },
                    { label: "Make complex breakfast first", subtext: "Spend 25 minutes preparing a meal before starting.", action: "BREAKFAST_DELAY" }
                ]);
            }
            // STAGE 2A: PHONE DISTRACTION LOOP
            else if (stageName === "PHONE_TRAPPED") {
                state.character.targetX = 520;
                state.impulse = 90;
                state.progress = 5;
                state.energy = 60;
                document.getElementById('scene-clock').innerText = '8:25 AM • Unplanned Time Transition';
                thoughtText.innerText = '"40 minutes elapsed while browsing content threads."';
                bannerText.innerText = 'Time elapsed. Select next intervention:';

                renderButtons([
                    { label: "Attempt urgent task sprint", subtext: "Rush immediately into work to compensate for lost time.", action: "PANIC_RUSH" },
                    { label: "Pause briefly, close tabs, sit at desk", subtext: "Reset focus environment and open main project tab.", action: "DESK_INITIATED" },
                    { label: "Set phone timer for 10 more minutes", subtext: "Allow short buffer period before switching tasks.", action: "EXTEND_PHONE" }
                ]);
            }
            // STAGE 2B: DESK INITIATION & PROCRASTINATION
            else if (stageName === "DESK_INITIATED") {
                state.character.targetX = 320;
                state.impulse = 50;
                state.progress = 25;
                document.getElementById('scene-clock').innerText = '8:10 AM • Workspace Initiation';
                thoughtText.innerText = '"Seated at desk. Workspace feels somewhat disorganized."';
                bannerText.innerText = 'Seated at workspace. Select focus strategy:';

                renderButtons([
                    { label: "Organize bookshelf and desk surface", subtext: "Clean surroundings thoroughly before beginning project.", action: "PRODUCTIVE_PROCRASTINATION" },
                    { label: "Write first single outline item", subtext: "Commit to completing one initial sentence or bullet point.", action: "MICRO_INITIATION" },
                    { label: "Open research tab for background material", subtext: "Begin reading background info without writing yet.", action: "HYPERFOCUS_RABBIT_HOLE" }
                ]);
            }
            // STAGE 3A: DEEP RESEARCH / HYPERFOCUS
            else if (stageName === "HYPERFOCUS_RABBIT_HOLE") {
                state.character.targetX = 320;
                state.impulse = 80;
                state.progress = 35;
                state.energy = 45;
                document.getElementById('scene-clock').innerText = '9:15 AM • Deep Information Branching';
                thoughtText.innerText = '"Reading article 14 on related subject matter. Original file untouched."';
                bannerText.innerText = 'Attention focused on adjacent topic. Select adjustment:';

                renderButtons([
                    { label: "Continue reading current topic", subtext: "Explore research branch further while interest remains active.", action: "DEEPER_RABBIT_HOLE" },
                    { label: "Copy current excerpt into document", subtext: "Transfer research notes directly into work file.", action: "CONVERT_RESEARCH" },
                    { label: "Reach out to colleague for quick check-in", subtext: "Message a peer about expected project progress.", action: "BODY_DOUBLE" }
                ]);
            }
            // STAGE 3B: PRODUCTIVE PROCRASTINATION
            else if (stageName === "PRODUCTIVE_PROCRASTINATION") {
                state.character.targetX = 200;
                state.impulse = 60;
                state.progress = 20;
                document.getElementById('scene-clock').innerText = '8:45 AM • Sorting Activity';
                thoughtText.innerText = '"Bookshelf organized by category. Desk surface is clear."';
                bannerText.innerText = 'Organization task completed. Select next action:';

                renderButtons([
                    { label: "Sit down and start timer for 5 minutes", subtext: "Commit to short focus block without outcome pressure.", action: "MICRO_INITIATION" },
                    { label: "Find another room area to clean", subtext: "Continue cleaning momentum in adjacent space.", action: "OVERWHELM_BURNOUT" },
                    { label: "Take 15 minute break", subtext: "Rest after completing room organization.", action: "EXTEND_PHONE" }
                ]);
            }
            // STAGE 3C: EXECUTIVE PARALYSIS
            else if (stageName === "TASK_PARALYSIS") {
                state.character.targetX = 320;
                state.impulse = 85;
                state.progress = 15;
                state.energy = 30;
                document.getElementById('scene-clock').innerText = '9:30 AM • Initiation Friction';
                thoughtText.innerText = '"Project scope appears large. Unclear where to begin."';
                bannerText.innerText = 'High initiation barrier detected. Select action:';

                renderButtons([
                    { label: "Break project into three 2-minute steps", subtext: "Reduce task scope to absolute smallest initial actions.", action: "MICRO_INITIATION" },
                    { label: "Force immediate output through sheer effort", subtext: "Attempt to write main section without outline.", action: "PANIC_RUSH" },
                    { label: "Step away to rest on bed", subtext: "Pause task engagement entirely for now.", action: "BED_RETREAT" }
                ]);
            }
            // STAGE 4A: SUSTAINED FLOW STATE
            else if (stageName === "FLOW_SUCCESS") {
                state.character.targetX = 320;
                state.impulse = 15;
                state.progress = 100;
                state.energy = 85;
                document.getElementById('scene-clock').innerText = '10:30 AM • Task Resolution';
                thoughtText.innerText = '"Core document completed through consistent micro-steps."';
                bannerText.innerText = 'Task milestone reached. Sequential progress maintained.';

                btnGrid = document.getElementById('button-grid');
                btnGrid.innerHTML = `
                    <button onclick="resetScene()" class="col-span-1 md:col-span-2 p-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-xs md:text-sm font-semibold text-white transition text-center shadow-sm">
                        Restart Scenario Path
                    </button>
                `;
            }
            // STAGE 4B: EXHAUSTION / BURNOUT
            else if (stageName === "OVERWHELM_BURNOUT") {
                state.character.targetX = 80;
                state.impulse = 95;
                state.progress = 25;
                state.energy = 10;
                document.getElementById('scene-clock').innerText = '10:45 AM • Cognitive Fatigue';
                thoughtText.innerText = '"Energy depleted following high-friction attempts."';
                bannerText.innerText = 'High stress output led to cognitive exhaustion.';

                btnGrid = document.getElementById('button-grid');
                btnGrid.innerHTML = `
                    <button onclick="resetScene()" class="col-span-1 md:col-span-2 p-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs md:text-sm font-semibold text-slate-200 transition text-center border border-slate-700">
                        Restart Scenario Path
                    </button>
                `;
            }

            updateHUD();
        }

        function intervene(action) {
            if (action === "LET_RUN") triggerStage("PHONE_TRAPPED");
            else if (action === "DESK_INITIATED") triggerStage("DESK_INITIATED");
            else if (action === "KITCHEN_SIDEQUEST") triggerStage("KITCHEN_SIDEQUEST");
            else if (action === "CLEAN_SINK") triggerStage("PRODUCTIVE_PROCRASTINATION");
            else if (action === "BREAKFAST_DELAY") triggerStage("PHONE_TRAPPED");
            else if (action === "PANIC_RUSH") triggerStage("OVERWHELM_BURNOUT");
            else if (action === "EXTEND_PHONE") triggerStage("TASK_PARALYSIS");
            else if (action === "PRODUCTIVE_PROCRASTINATION") triggerStage("PRODUCTIVE_PROCRASTINATION");
            else if (action === "MICRO_INITIATION") triggerStage("FLOW_SUCCESS");
            else if (action === "HYPERFOCUS_RABBIT_HOLE") triggerStage("HYPERFOCUS_RABBIT_HOLE");
            else if (action === "DEEPER_RABBIT_HOLE") triggerStage("TASK_PARALYSIS");
            else if (action === "CONVERT_RESEARCH") triggerStage("FLOW_SUCCESS");
            else if (action === "BODY_DOUBLE") triggerStage("FLOW_SUCCESS");
            else if (action === "BED_RETREAT") triggerStage("OVERWHELM_BURNOUT");
        }

        function updateHUD() {
            document.getElementById('val-progress').innerText = state.progress + '%';
            document.getElementById('bar-progress').style.width = state.progress + '%';

            document.getElementById('val-impulse').innerText = state.impulse + '%';
            document.getElementById('bar-impulse').style.width = state.impulse + '%';

            document.getElementById('val-energy').innerText = state.energy + '%';
            document.getElementById('bar-energy').style.width = state.energy + '%';
        }

        canvas.addEventListener('click', function(e) {
            let rect = canvas.getBoundingClientRect();
            let clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            let clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

            for (let key in ROOM) {
                let item = ROOM[key];
                if (clickX >= item.x && clickX <= item.x + item.width &&
                    clickY >= item.y && clickY <= item.y + item.height) {
                    
                    handleObjectClick(item.hotspot);
                    break;
                }
            }
        });

        function handleObjectClick(hotspot) {
            const thoughtText = document.getElementById('thought-text');

            if (hotspot === "PHONE") {
                thoughtText.innerText = '"Digital notifications produce strong immediate interest."';
            } else if (hotspot === "DESK") {
                thoughtText.innerText = '"Primary workspace. Task engagement requires reduced friction."';
            } else if (hotspot === "BOOKSHELF") {
                thoughtText.innerText = '"Organizing items provides structured activity, though secondary to main task."';
            } else if (hotspot === "WINDOW") {
                thoughtText.innerText = '"External environment observation."';
            } else if (hotspot === "BED") {
                thoughtText.innerText = '"Rest space. Tempting when mental exhaustion rises."';
            }
        }

        function resetScene() {
            triggerStage("PHONE_RUSH");
        }

        window.onload = function() {
            triggerStage("PHONE_RUSH");
            updateAnimation();
        };
    </script>
</body>
</html>
